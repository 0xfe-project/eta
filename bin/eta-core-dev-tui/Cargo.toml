[package]
name = "eta-core-dev-tui"
version.workspace = true
edition.workspace = true
publish = false

[[bin]]
name = "eta-core-dev-tui"
path = "src/main.rs"

[dependencies]
# Rendering + terminal input.
ratatui.workspace = true
crossterm.workspace = true
tui-textarea.workspace = true
tokio.workspace = true
serde_json.workspace = true
uuid.workspace = true

# eta engine events + the controller that owns every adapter.
eta-core = { path = "../../crates/core/eta-core" }
eta-system-prompts = { path = "../../crates/core/eta-system-prompts" }
eta-fs = { path = "../../crates/adapters/eta-fs" }
eta-sqlite-storage = { path = "../../crates/adapters/eta-sqlite-storage" }
eta-core-controller = { path = "../../crates/adapters/eta-core-controller" }

[dev-dependencies]
tempfile = "3"
tokio-stream.workspace = true
# Tests inject mock providers straight into controller::SpawnPlan.
eta-llm = { path = "../../crates/core/eta-llm" }
