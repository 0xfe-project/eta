[package]
name = "eta-core-dev-tui"
version.workspace = true
edition.workspace = true
publish = false

[[bin]]
name = "eta-core-dev-tui"
path = "src/main.rs"

[dependencies]
# Rendering + terminal input.
ratatui.workspace = true
crossterm.workspace = true
tui-textarea.workspace = true
clap.workspace = true
tokio.workspace = true

# eta engine + real adapters (wired up in later Part E items).
eta-core = { path = "../../crates/core/eta-core" }
eta-session = { path = "../../crates/core/eta-session" }
eta-fs = { path = "../../crates/adapters/eta-fs" }
eta-sqlite-storage = { path = "../../crates/adapters/eta-sqlite-storage" }
eta-io-tools = { path = "../../crates/adapters/eta-io-tools" }
eta-provider-openai = { path = "../../crates/adapters/eta-provider-openai" }
eta-provider-anthropic = { path = "../../crates/adapters/eta-provider-anthropic" }
eta-mcp = { path = "../../crates/adapters/eta-mcp" }
eta-config = { path = "../../crates/core/eta-config" }
eta-anycodingagent-config-reader = { path = "../../crates/adapters/eta-anycodingagent-config-reader" }
