[workspace]
resolver = "3"
members = [
    "crates/core/*",
    "crates/adapters/*",
    "crates/tests-helper/*",
    "tests",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
# error
thiserror = "2"

# storage
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# async
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = "0.7"
async-trait = "0.1"


reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "rustls-tls"] }



# compile options

[profile.dev]
opt-level = 1
debug = 1
incremental = true
codegen-units = 256
lto = false
panic = "abort"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
incremental = false
overflow-checks = false
debug-assertions = false
