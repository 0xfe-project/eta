# The agent queue's NATS server (docs/architecture/queue.md). Two kinds of
# clients, in one account (AXP):
#
# - services: the control plane and the routine service, user "services",
#   with every permission;
# - agent runtimes: they connect with their runtime key and nothing else;
#   NATS asks the control plane who holds it (auth callout, answered by the
#   internal API's process) and lets the connection use only that agent's
#   subjects and consumer.
#
# AXP_NATS_PASSWORD is the services' password, AXP_NATS_CALLOUT_ISSUER the
# public key the control plane signs its answers with (from
# AXP_NATS_CALLOUT_SEED; `axp-control-plane nats-callout-key` makes a pair).

port: 4222
http_port: 8222
jetstream {
  store_dir: /data
}

accounts {
  AXP {
    jetstream: enabled
    users: [{user: services, password: $AXP_NATS_PASSWORD}]
  }
  SYS {}
}
system_account: SYS

authorization {
  auth_callout {
    issuer: $AXP_NATS_CALLOUT_ISSUER
    auth_users: [services]
    account: AXP
  }
}
