# eta on one machine: `docker compose -f deploy/compose.yaml up -d --build`.
#
# The host listens on :8787 (put your proxy in front of it; behind a proxy set
# ETA_ALLOW_ORIGIN to the page's origin, e.g. https://eta.example.com). The token is in
# the data volume (`HOME` is /data, so the files are under /data/.eta):
# `docker compose -f deploy/compose.yaml exec eta cat /data/.eta/access-token`,
# then open http://<host>:8787/?token=<token> once.
#
# The host runs as the image's non-root `bun` user (uid 1000) and so do the sessions' bash. A fresh
# eta-data volume is owned by it; a volume from an older (root) image needs one chown:
#   docker compose -f deploy/compose.yaml run --rm -u 0 --entrypoint chown eta -R 1000:1000 /data
#
# Memory is optional. Turn it on with the profile and the model that extracts facts:
#   MEMORY_LLM_BASE_URL=https://api.openai.com/v1 MEMORY_LLM_API_KEY=... MEMORY_LLM_MODEL=gpt-5-mini \
#   ETA_MEMORY_URL=http://memory:8320 docker compose -f deploy/compose.yaml --profile memory up -d --build
#
# GitHub is optional too, and off by default: with it the host loads the App, the `github` target, the
# agents' pull-request and issue tools, the callbacks and the git/gh login, and the page shows
# settings → Connections. `ETA_GITHUB=1` (or a `--github` in `command:` below) turns it on.
services:
  eta:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    ports:
      - "8787:8787"
    volumes:
      - eta-data:/data
    environment:
      # Empty means no memory; the host reads it when --memory-url is not given.
      ETA_MEMORY_URL: ${ETA_MEMORY_URL:-}
      # GitHub is off unless this says otherwise (1/true/yes/on) — see docs/architecture/github.md.
      # A `--github` in the command below does the same and wins over this; anything else (or
      # nothing) leaves the whole chain unloaded, so nothing GitHub is ever asked for.
      ETA_GITHUB: ${ETA_GITHUB:-}
    command: ["--allow-origin", "${ETA_ALLOW_ORIGIN:-http://localhost:8787}"]

  memory:
    profiles: [memory]
    build:
      context: ..
      dockerfile: deploy/memory.Dockerfile
    restart: unless-stopped
    depends_on:
      memory-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://eta:eta@memory-db:5432/eta_memory
      MEMORY_HOST: 0.0.0.0
      MEMORY_LLM_BASE_URL: ${MEMORY_LLM_BASE_URL:-}
      MEMORY_LLM_API_KEY: ${MEMORY_LLM_API_KEY:-}
      MEMORY_LLM_MODEL: ${MEMORY_LLM_MODEL:-}

  memory-db:
    profiles: [memory]
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: eta
      POSTGRES_PASSWORD: eta
      POSTGRES_DB: eta_memory
    volumes:
      - memory-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eta -d eta_memory"]
      interval: 5s
      retries: 10

volumes:
  eta-data:
  memory-db:
