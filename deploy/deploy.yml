# Kamal production deployment onto the machine that runs it. Use
# deploy/deploy.sh, which prepares SSH, the registry, secrets, the runtime
# network and image, and passes the per-machine values this file reads.
<% host = ENV.fetch("AXP_DEPLOY_HOST", "127.0.0.1") %>
<% public_host = ENV["AXP_PUBLIC_HOST"].to_s %>
service: axp
image: axp
secrets_path: deploy/secrets

servers:
  # Edge gateway: the only role behind kamal-proxy. It routes /api/llm to the
  # LLM gateway, /api to the control plane and everything else to web, and
  # signs each request with AXP_EDGE_SECRET.
  gateway:
    hosts: [<%= host %>]
    cmd: axp-gateway
    env:
      clear:
        AXP_GATEWAY_ADDR: ":8080"
        AXP_GATEWAY_UPSTREAM_WEB: http://axp-web:3000
        AXP_GATEWAY_UPSTREAM_API: http://axp-api:8000
        AXP_GATEWAY_UPSTREAM_LLM: http://axp-llm:8317
    proxy:
      app_port: 8080
      # SSE: stream responses through and allow long-lived connections.
      response_timeout: 3600
      buffering:
        responses: false
      healthcheck:
        path: /up
  # TanStack Start SSR and static assets; reached only through the gateway.
  web:
    hosts: [<%= host %>]
    cmd: bun /app/apps/web/server.js
    options:
      network-alias: axp-web
  # Public API (Django); reached only through the gateway.
  api:
    hosts: [<%= host %>]
    cmd: sh -c "python manage.py migrate --noinput && exec python -m gunicorn config.wsgi --bind 0.0.0.0:8000 --worker-class gthread --workers 2 --threads 32"
    options:
      network-alias: axp-api
  # LLM gateway (embedded CLIProxyAPI): connections and model catalog behind
  # the gateway as axp-llm; runtimes call its OpenAI-compatible API as
  # http://llm-gateway:8317/v1 on the runtime network. Credentials live in
  # the axp-llm volume.
  llm:
    hosts: [<%= host %>]
    cmd: axp-llm-gateway
    env:
      clear:
        AXP_LLM_ADDR: ":8317"
        AXP_LLM_STATE_DIR: /data/llm
    options:
      network-alias: axp-llm
      network: name=axp-prod-runtime,alias=llm-gateway
      volume: axp-llm:/data/llm
  # Internal runtime API. Runtimes reach it as http://axp-internal:8001 on the
  # runtime network; it is never published or proxied.
  internal:
    hosts: [<%= host %>]
    cmd: python -m gunicorn config.wsgi --bind 0.0.0.0:8001 --worker-class gthread --workers 2 --threads 16
    env:
      clear:
        AXP_URLCONF: config.internal_urls
    options:
      network: name=axp-prod-runtime,alias=axp-internal
      volume: axp-objects:/data/objects
  # Starts and stops agent runtime containers through the host Docker socket.
  controller:
    hosts: [<%= host %>]
    cmd: python manage.py run_controller
    options:
      network: axp-prod-runtime
      volume:
        - axp-objects:/data/objects
        - /var/run/docker.sock:/var/run/docker.sock

primary_role: gateway

proxy:
<% if public_host.empty? %>
  ssl: false
<% else %>
  host: <%= public_host %>
  ssl: <%= ENV.fetch("AXP_PROXY_SSL", "false") %>
<% end %>
  run:
    bind_ips: [<%= ENV.fetch("AXP_PROXY_BIND", "127.0.0.1") %>]
    http_port: <%= ENV.fetch("AXP_PROD_HTTP_PORT") %>
    https_port: <%= ENV.fetch("AXP_PROD_HTTPS_PORT") %>

registry:
  # A plain registry container on this machine, started by deploy/deploy.sh.
  # Ports come from deploy/ports.env.
  # Kamal's built-in localhost registry tunnels over SSH, which collides with
  # itself when the deploy machine and the server are the same host.
  server: 127.0.0.1:<%= ENV.fetch("AXP_PROD_REGISTRY_PORT") %>
  username: axp
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: <%= ENV.fetch("AXP_BUILD_ARCH") %>
  driver: docker
  # Build from the working tree: the image copies artifacts that deploy.sh
  # builds with Turbo and that are not committed.
  context: .
  dockerfile: deploy/Dockerfile

ssh:
  user: <%= ENV.fetch("AXP_DEPLOY_USER") %>
  port: <%= ENV.fetch("AXP_SSH_PORT", "22") %>
  keys_only: true
  keys: [/kamal/ssh/id_ed25519]

env:
  clear:
    DJANGO_DEBUG: "false"
    DJANGO_ALLOWED_HOSTS: "*"
    AXP_HOST_ID: <%= ENV.fetch("AXP_HOST_ID", "axp") %>
    AXP_RUNTIME_IMAGE: axp-agent-runtime:production
    AXP_RUNTIME_NETWORK: axp-prod-runtime
    AXP_INTERNAL_URL: http://axp-internal:8001
    AXP_OBJECT_DIR: /data/objects
    AXP_LLM_GATEWAY_URL: http://axp-llm:8317
    AXP_LLM_RUNTIME_BASE_URL: http://llm-gateway:8317/v1
<% if ENV["AXP_CODEX_AUTH_FILE"].to_s != "" %>
    # Host path; the controller bind-mounts it into each runtime.
    AXP_CODEX_AUTH_FILE: <%= ENV["AXP_CODEX_AUTH_FILE"] %>
<% end %>
  secret:
    - DJANGO_SECRET_KEY
    - DATABASE_URL
    - AXP_EDGE_SECRET
    - AXP_LLM_API_KEY
    - OPENAI_API_KEY

accessories:
  postgres:
    image: postgres:17
    host: <%= host %>
    env:
      clear:
        POSTGRES_USER: axp
        POSTGRES_DB: axp
      secret:
        - POSTGRES_PASSWORD
    volumes:
      - axp-postgres:/var/lib/postgresql/data
