# Kamal production deployment onto the machine that runs it. Use
# deploy/deploy.sh, which prepares SSH, the registry, secrets, the runtime
# network and image, and passes the per-machine values this file reads.
#
# ERB statement tags sit inside YAML comments: ERB still runs them (tags in
# comments are code too), and the template stays valid YAML for dprint.
# <% host = ENV.fetch("AXP_DEPLOY_HOST", "127.0.0.1") %>
# <% public_host = ENV["AXP_PUBLIC_HOST"].to_s %>
# Artifacts' object storage: the built-in SeaweedFS (accessory s3) unless
# AXP_S3_BUILTIN=false, then the external S3 that AXP_S3_* in
# production.env name (deploy/README.md).
# <% builtin_s3 = ENV.fetch("AXP_S3_BUILTIN", "true") != "false" %>
service: axp
image: axp
secrets_path: deploy/secrets

# Readiness: every role has a Docker health check, polled quickly while the
# container starts, and Kamal waits on it instead of a fixed delay. Python is
# in the image (for the memory service); a role is ready once it answers HTTP
# at all.
# <% ready = ->(port, path = "/") { %(python -c "import http.client as h; c = h.HTTPConnection('127.0.0.1', #{port}, timeout=1); c.request('GET', '#{path}'); c.getresponse()") } %>
x-health: &health
  health-interval: 30s
  health-start-period: 60s
  health-start-interval: 500ms
  health-retries: 3

# Secrets: each role gets only those it reads (deploy/README.md). The
# control plane's API and controller share one initialization, so they get
# all; its routine worker reads only the database.
x-secrets:
  control-plane: &control-plane-secrets
    - AXP_SECRET_KEY
    - DATABASE_URL
    - AXP_RELAY_ADMIN_SECRET
    - OTEL_EXPORTER_OTLP_HEADERS
    - AXP_S3_ACCESS_KEY_ID
    - AXP_S3_SECRET_ACCESS_KEY
  database: &database-secrets
    - DATABASE_URL
    - OTEL_EXPORTER_OTLP_HEADERS
  telemetry: &telemetry-secrets
    - OTEL_EXPORTER_OTLP_HEADERS

# The other roles boot together once the gateway is healthy.
boot:
  parallel_roles: true
# Kamal also polls the health checks above, so no fixed delay is needed.
readiness_delay: 0
# Chat streams (SSE) never finish by themselves; browsers reconnect with
# Last-Event-ID, so old containers are not waited on for long. This is also
# the stop timeout of the unproxied roles (the control plane waits a second).
drain_timeout: 2

servers:
  # The browser's gateway (apps/gateway/public.caddy): the only role behind
  # kamal-proxy. It routes /api/memory to the memory service, /api (with
  # /api/forge, /api/routines and /api/llm) to the control plane's public
  # listener and everything else to web.
  gateway:
    hosts: [<%= host %>]
    cmd: caddy run --config /app/apps/gateway/Caddyfile
    env:
      clear:
        AXP_GATEWAY_SITES: public.caddy
    proxy:
      app_port: 8080
      # SSE: stream responses through and allow long-lived connections.
      response_timeout: 3600
      buffering:
        responses: false
      healthcheck:
        path: /up
  # Runtimes' gateway (apps/gateway/runtime.caddy), on their network as
  # axp-runtime-gateway:8090: their only route to the control plane's
  # internal listener (with /forge, /routines and the LLM gateway's /v1)
  # and the memory, which it authenticates them for.
  runtime-gateway:
    hosts: [<%= host %>]
    cmd: caddy run --config /app/apps/gateway/Caddyfile
    env:
      clear:
        AXP_GATEWAY_SITES: runtime.caddy
    options:
      network: name=axp-prod-runtime,alias=axp-runtime-gateway
      <<: *health
      health-cmd: <%= ready.(8090) %>
  # TanStack Start SSR and static assets; reached only through the gateway.
  web:
    hosts: [<%= host %>]
    cmd: bun /app/apps/web/server.js
    env:
      secret: *telemetry-secrets
    options:
      network-alias: axp-web
      <<: *health
      health-cmd: <%= ready.(3000) %>
  # The control plane's APIs (with code hosting, routines' API and the LLM
  # gateway), in one process on two listeners: the public one (:8000)
  # reached only through the gateway, the internal one (:8001) through the
  # runtime gateway and by the control plane's other roles and the memory
  # service (the LLM gateway's /v1 and catalog). The GitHub App's
  # credentials live in the axp-forge volume, the LLM gateway's
  # (connections, catalog, usage) in axp-llm, at the path the retired llm
  # role used. Ready once both listeners answer, which they do once the LLM
  # gateway has loaded its credentials; upstream model failures never make
  # it unready.
  api:
    hosts: [<%= host %>]
    # deploy/deploy.sh migrates with the new image before the roles boot.
    cmd: axp-control-plane serve
    env:
      secret: *control-plane-secrets
      clear:
        OTEL_SERVICE_NAME: control-plane
        AXP_FORGE_STATE_DIR: /app/var/forge
    options:
      network-alias: axp-api
      volume:
        - axp-forge:/app/var/forge
        - axp-llm:/app/apps/control-plane/var/llm-gateway
      <<: *health
      health-cmd: <%= ready.(8000, "/api/health") %> && <%= ready.(8001) %>
  # Agents' memories (apps/memory-service) as axp-memory: runtimes reach
  # /memory through the runtime gateway, the browser /api/memory through the
  # gateway. Facts are extracted through the LLM gateway (the control
  # plane's internal listener) and kept in PostgreSQL (pgvector).
  memory:
    hosts: [<%= host %>]
    cmd: python -m axp_memory
    env:
      secret: *database-secrets
      clear:
        PYTHONPATH: /app/apps/memory-service/site-packages:/app/apps/memory-service
        FASTEMBED_CACHE_PATH: /app/apps/memory-service/models
        # The model is in the image; never look for it online.
        HF_HUB_OFFLINE: "1"
        AXP_MEMORY_ADDR: ":8320"
        AXP_LLM_GATEWAY_URL: http://axp-api:8001
    options:
      network-alias: axp-memory
      <<: *health
      health-cmd: <%= ready.(8320, "/up") %>
  # Routines' runs (axp-control-plane routine-worker): takes their fires
  # from NATS and runs each as an ADK agent in this process, and revises
  # briefs from feedback; the API only records and publishes. Routines keep
  # their own database (axp_routines on the postgres accessory). One worker
  # at a time: a new one waits for the old one's lock, and the old one
  # records its runs as interrupted when it stops.
  routine-worker:
    hosts: [<%= host %>]
    cmd: axp-control-plane routine-worker
    env:
      secret: *database-secrets
      clear:
        OTEL_SERVICE_NAME: control-plane-routine-worker
    stop_timeout: 30
    options:
      # No port: the process running is ready.
      <<: *health
      health-cmd: "true"
  # Builds agents' images and runs their containers through the host Docker
  # socket, and delivers their work: the one role runtimes' control API is
  # reachable from.
  controller:
    hosts: [<%= host %>]
    cmd: axp-control-plane controller
    env:
      secret: *control-plane-secrets
      clear:
        OTEL_SERVICE_NAME: control-plane-controller
    # It exits after the tick in progress, which may be stopping a runtime.
    stop_timeout: 30
    options:
      network: axp-prod-runtime
      volume: /var/run/docker.sock:/var/run/docker.sock
      # No port: the process running is ready. A new controller waits for the
      # old one's lock, which is released only after this passes.
      <<: *health
      health-cmd: "true"

primary_role: gateway

proxy:
  # <% unless public_host.empty? %>
  host: <%= public_host %>
  # <% end %>
  ssl: <%= !public_host.empty? && ENV.fetch("AXP_PROXY_SSL", "false") %>
  run:
    bind_ips:
      - <%= ENV.fetch("AXP_PROXY_BIND", "127.0.0.1") %>
    http_port: <%= ENV.fetch("AXP_PROD_HTTP_PORT") %>
    https_port: <%= ENV.fetch("AXP_PROD_HTTPS_PORT") %>

registry:
  # A plain registry container on this machine, started by deploy/deploy.sh.
  # Ports come from deploy/ports.env.
  # Kamal's built-in localhost registry tunnels over SSH, which collides with
  # itself when the deploy machine and the server are the same host.
  server: 127.0.0.1:<%= ENV.fetch("AXP_PROD_REGISTRY_PORT") %>
  username: axp
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: <%= ENV.fetch("AXP_BUILD_ARCH") %>
  driver: docker
  # Build from the working tree: the image copies artifacts that deploy.sh
  # builds with Turbo and that are not committed.
  context: .
  dockerfile: deploy/Dockerfile

ssh:
  user: <%= ENV.fetch("AXP_DEPLOY_USER") %>
  port: <%= ENV.fetch("AXP_SSH_PORT", "22") %>
  keys_only: true
  keys: [/kamal/ssh/id_ed25519]

env:
  clear:
    # Logs and traces go to the OpenObserve accessory. Runtime containers do
    # not get these: they run agent code and hold no secrets.
    OTEL_EXPORTER_OTLP_ENDPOINT: http://axp-openobserve:5080/observe/api/default
    OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=production
    # Remote computers (docs/architecture/tasks.md): where they reach AXP and
    # the relay, under AXP's address at /remote/relay (the gateway's route to
    # it). Off while AXP_PUBLIC_URL is unset in production.env.
    AXP_PUBLIC_URL: '<%= ENV.fetch("AXP_PUBLIC_URL", "") %>'
    AXP_RELAY_BASE_URL: '<%= ENV.fetch("AXP_PUBLIC_URL", "").chomp("/").then { |u| u.empty? ? "" : u + "/remote/relay" } %>'
    # Artifacts' S3 (the control plane): the built-in accessory, or an
    # external service's endpoint, bucket and region.
    AXP_S3_ENDPOINT: '<%= builtin_s3 ? "http://axp-s3:8333" : ENV.fetch("AXP_S3_ENDPOINT") %>'
    AXP_S3_BUCKET: '<%= ENV.fetch("AXP_S3_BUCKET", "axp-artifacts") %>'
    AXP_S3_REGION: '<%= ENV.fetch("AXP_S3_REGION", "us-east-1") %>'

accessories:
  postgres:
    # PostgreSQL 17 with pgvector, on Debian trixie like postgres:17, so the
    # data directory keeps its collation. deploy.sh names it too.
    image: pgvector/pgvector:pg17-trixie
    host: <%= host %>
    env:
      clear:
        POSTGRES_USER: axp
        POSTGRES_DB: axp
      secret:
        - POSTGRES_PASSWORD
    volumes:
      - axp-postgres:/var/lib/postgresql/data
  # NATS JetStream, on the runtime network as axp-nats:4222 for runtimes
  # (their events) and on Kamal's for the control plane (with routines'
  # schedules). Never published.
  nats:
    image: nats:2.14-alpine
    host: <%= host %>
    cmd: --jetstream --store_dir /data
    volumes:
      - axp-nats:/data
    options:
      network: name=axp-prod-runtime,alias=axp-nats
  # The agenvo relay (deploy/relay.Dockerfile) that remote computers'
  # connectors pair with, on Kamal's network as axp-relay:8080 for the control
  # plane and the gateway, which serves it at AXP_RELAY_BASE_URL. One process
  # owns its SQLite state, so it is an accessory: deploys leave it running,
  # deploy.sh reboots it only onto a new agenvo version.
  relay:
    image: <%= ENV.fetch("AXP_RELAY_IMAGE", "axp-relay:unbuilt") %>
    host: <%= host %>
    files:
      - deploy/relay.json.erb:/config/relay.json
    env:
      secret:
        - AGENVO_ADMIN_SECRET
    volumes:
      - axp-relay:/home/node
  # <% if builtin_s3 %>
  # Artifacts' objects: SeaweedFS's S3 API on Kamal's network as
  # axp-s3:8333, for the control plane alone. Never published and not on
  # the runtime network: besides S3 it serves its filer, master, volume and
  # admin APIs without authentication. Off with AXP_S3_BUILTIN=false.
  s3:
    image: chrislusf/seaweedfs:4.48
    host: <%= host %>
    cmd: mini -dir=/data
    env:
      secret:
        - AWS_ACCESS_KEY_ID
        - AWS_SECRET_ACCESS_KEY
    volumes:
      - axp-objects:/data
  # <% end %>
  # Logs and traces (OTLP), with its UI on 127.0.0.1:AXP_PROD_OBSERVE_PORT.
  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:v1.0.4
    host: <%= host %>
    port: '127.0.0.1:<%= ENV.fetch("AXP_PROD_OBSERVE_PORT") %>:5080'
    env:
      clear:
        ZO_ROOT_USER_EMAIL: root@axp.local
        ZO_DATA_DIR: /data
        # Served under /observe so the gateway can proxy it (deploy.sh
        # reboots the accessory when this is missing).
        ZO_BASE_URI: /observe
      secret:
        - ZO_ROOT_USER_PASSWORD
    volumes:
      - axp-openobserve:/data
  # Receives OTLP from agent runtimes, which hold no credentials, on the
  # runtime network as otel-collector:4318 and forwards it to OpenObserve.
  otel-collector:
    # contrib: has the filter processor (otel-collector.yaml).
    image: otel/opentelemetry-collector-contrib:0.162.0
    host: <%= host %>
    files:
      # The contrib image reads /etc/otelcol-contrib/config.yaml.
      - deploy/otel-collector.yaml:/etc/otelcol-contrib/config.yaml
    env:
      clear:
        OPENOBSERVE_ENDPOINT: http://axp-openobserve:5080/observe/api/default
      secret:
        - OPENOBSERVE_AUTHORIZATION
    options:
      network: name=axp-prod-runtime,alias=otel-collector
