# PostgreSQL 17 with pgvector, on Debian trixie like postgres:17, so a data
# directory keeps its collation. The control plane's database (axp),
# routines' (axp_routines) and bundles' services' (axp_bundle_<name>).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres
spec:
  storageClassName: axp
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 20Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  strategy: { type: Recreate }
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg17-trixie
          env:
            - { name: POSTGRES_USER, value: axp }
            - { name: POSTGRES_DB, value: axp }
            - name: POSTGRES_PASSWORD
              valueFrom: {
                secretKeyRef: { name: infra, key: POSTGRES_PASSWORD },
              }
          ports: [{ containerPort: 5432 }]
          readinessProbe:
            exec: { command: [pg_isready, -U, axp] }
            periodSeconds: 2
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
      volumes: [{ name: data, persistentVolumeClaim: { claimName: postgres } }]
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: { app: postgres }
  ports: [{ port: 5432 }]
