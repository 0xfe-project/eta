# Artifacts' objects: SeaweedFS's S3 API, for the control plane alone.
# Besides S3 it serves its filer, master, volume and admin APIs without
# authentication, so nothing outside the namespace reaches it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: objects
spec:
  storageClassName: axp
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 20Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: s3
spec:
  strategy: { type: Recreate }
  selector: { matchLabels: { app: s3 } }
  template:
    metadata: { labels: { app: s3 } }
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:4.48
          args: [mini, -dir=/data]
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom: {
                secretKeyRef: { name: infra, key: AXP_S3_ACCESS_KEY_ID },
              }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: {
                secretKeyRef: { name: infra, key: AXP_S3_SECRET_ACCESS_KEY },
              }
          ports: [{ containerPort: 8333 }]
          volumeMounts: [{ name: data, mountPath: /data }]
      volumes: [{ name: data, persistentVolumeClaim: { claimName: objects } }]
---
apiVersion: v1
kind: Service
metadata:
  name: s3
spec:
  selector: { app: s3 }
  ports: [{ port: 8333 }]
