# The registries images are pushed to and built from (deploy/k3s/infra/images.yaml),
# production's and development's, over plain HTTP inside the cluster.
[registry."10.43.100.1:5000"]
  http = true
[registry."10.43.100.11:5000"]
  http = true

# The build cache stays under this much.
[worker.oci]
  gc = true
  gckeepstorage = "30GB"
