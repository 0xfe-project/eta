# Logs and traces: OpenObserve, served under /observe (the gateway proxies
# it), and the collector runtimes and bundles' services export to without
# credentials (otel-collector.yaml).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openobserve
spec:
  storageClassName: axp
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 20Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openobserve
spec:
  strategy: { type: Recreate }
  selector: { matchLabels: { app: openobserve } }
  template:
    metadata: { labels: { app: openobserve } }
    spec:
      containers:
        - name: openobserve
          image: public.ecr.aws/zinclabs/openobserve:v1.0.4
          env:
            - { name: ZO_ROOT_USER_EMAIL, value: root@axp.local }
            - name: ZO_ROOT_USER_PASSWORD
              valueFrom: {
                secretKeyRef: { name: infra, key: AXP_OBSERVE_PASSWORD },
              }
            - { name: ZO_DATA_DIR, value: /data }
            - { name: ZO_BASE_URI, value: /observe }
          ports: [{ containerPort: 5080 }]
          readinessProbe:
            httpGet: { path: /observe/healthz, port: 5080 }
          volumeMounts: [{ name: data, mountPath: /data }]
      volumes: [
        { name: data, persistentVolumeClaim: { claimName: openobserve } },
      ]
---
apiVersion: v1
kind: Service
metadata:
  name: openobserve
spec:
  selector: { app: openobserve }
  ports: [{ port: 5080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
spec:
  selector: { matchLabels: { app: otel-collector } }
  template:
    metadata: { labels: { app: otel-collector } }
    spec:
      containers:
        - name: otel-collector
          # contrib: has the filter processor.
          image: otel/opentelemetry-collector-contrib:0.162.0
          args: [--config=/etc/otelcol/config.yaml]
          env:
            - name: OPENOBSERVE_ENDPOINT
              value: http://openobserve:5080/observe/api/default
            - name: OPENOBSERVE_AUTHORIZATION
              valueFrom: {
                secretKeyRef: { name: infra, key: OPENOBSERVE_AUTHORIZATION },
              }
          ports: [{ containerPort: 4318 }]
          volumeMounts: [{ name: config, mountPath: /etc/otelcol }]
      volumes: [{ name: config, configMap: { name: otel-collector } }]
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
spec:
  selector: { app: otel-collector }
  ports: [{ port: 4318 }]
