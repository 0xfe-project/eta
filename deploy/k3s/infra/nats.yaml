# NATS JetStream: runtimes publish their events here, and routines'
# schedules live here. No authentication: only AXP's namespaces reach it
# (policies.yaml).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nats
spec:
  storageClassName: axp
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 5Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats
spec:
  strategy: { type: Recreate }
  selector: { matchLabels: { app: nats } }
  template:
    metadata: { labels: { app: nats } }
    spec:
      containers:
        - name: nats
          image: nats:2.14-alpine
          args: [--jetstream, --store_dir, /data, --http_port, "8222"]
          ports: [{ containerPort: 4222 }]
          readinessProbe:
            httpGet: { path: /healthz, port: 8222 }
            periodSeconds: 2
          volumeMounts: [{ name: data, mountPath: /data }]
      volumes: [{ name: data, persistentVolumeClaim: { claimName: nats } }]
---
apiVersion: v1
kind: Service
metadata:
  name: nats
spec:
  selector: { app: nats }
  ports: [{ port: 4222 }]
