# What AXP runs on, the same in production (namespace axp) and development
# (axp-dev): PostgreSQL, NATS, the S3 for artifacts, Rustrak (errors, logs
# and traces), and the registry and BuildKit daemon agents' images are built
# with. The overlay sets the namespace, the registry's and BuildKit's fixed
# addresses and the Secret `infra`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - storage.yaml
  - crd.yaml
  - postgres.yaml
  - nats.yaml
  - s3.yaml
  - rustrak.yaml
  - images.yaml
  - policies.yaml
configMapGenerator:
  - name: buildkitd
    files: [buildkitd.toml]
patches:
  # Kubernetes' service variables (S3_PORT=tcp://…) collide with programs'
  # own settings.
  - target: { kind: Deployment }
    patch: '[{"op": "add", "path": "/spec/template/spec/enableServiceLinks", "value": false}]'
