# Agents' images (internal/container), and AXP's own: built by BuildKit,
# kept in the registry. The node pulls from the registry at its fixed
# ClusterIP (the overlay sets both addresses; /etc/rancher/k3s/registries.yaml
# names them, deploy/k3s/README.md).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: registry
spec:
  storageClassName: axp
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 50Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
spec:
  strategy: { type: Recreate }
  selector: { matchLabels: { app: registry } }
  template:
    metadata: { labels: { app: registry } }
    spec:
      containers:
        - name: registry
          image: registry:3
          env:
            # The controller deletes agent images no agent uses.
            - { name: REGISTRY_STORAGE_DELETE_ENABLED, value: "true" }
          ports: [{ containerPort: 5000 }]
          volumeMounts: [{ name: data, mountPath: /var/lib/registry }]
      volumes: [{ name: data, persistentVolumeClaim: { claimName: registry } }]
---
apiVersion: v1
kind: Service
metadata:
  name: registry
spec:
  selector: { app: registry }
  ports: [{ port: 5000 }]
---
# Frees the layers of deleted images, at night.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: registry-gc
spec:
  schedule: "30 4 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: gc
              image: registry:3
              command: [
                registry,
                garbage-collect,
                --delete-untagged,
                /etc/distribution/config.yml,
              ]
              volumeMounts: [{ name: data, mountPath: /var/lib/registry }]
          volumes: [
            { name: data, persistentVolumeClaim: { claimName: registry } },
          ]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: buildkit
spec:
  storageClassName: axp
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 50Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: buildkitd
spec:
  strategy: { type: Recreate }
  selector: { matchLabels: { app: buildkitd } }
  template:
    metadata: { labels: { app: buildkitd } }
    spec:
      containers:
        - name: buildkitd
          image: moby/buildkit:v0.34.0
          args: [
            --addr,
            tcp://0.0.0.0:1234,
            --config,
            /etc/buildkit/buildkitd.toml,
          ]
          # Builds run their steps in containers of their own.
          securityContext: { privileged: true }
          ports: [{ containerPort: 1234 }]
          readinessProbe:
            exec: {
              command: [buildctl, --addr, tcp://127.0.0.1:1234, debug, workers],
            }
          volumeMounts:
            - { name: data, mountPath: /var/lib/buildkit }
            - { name: config, mountPath: /etc/buildkit }
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: buildkit } }
        - { name: config, configMap: { name: buildkitd } }
---
apiVersion: v1
kind: Service
metadata:
  name: buildkitd
spec:
  selector: { app: buildkitd }
  ports: [{ port: 1234 }]
