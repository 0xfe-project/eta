# A bundle's service (docs/architecture/bundles.md#服务): the controller
# writes one for each bundle that has a service, applies its manifests
# under it and records how it is. Deleting it deletes what it owns, except
# volumes and the database. Edits by hand are overwritten.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: bundleservices.axp.dev
spec:
  group: axp.dev
  scope: Namespaced
  names:
    kind: BundleService
    plural: bundleservices
    singular: bundleservice
    shortNames: [bs]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources: { status: {} }
      additionalPrinterColumns:
        - { name: State, type: string, jsonPath: .status.state }
        - { name: Version, type: string, jsonPath: .status.version }
        - { name: Message, type: string, jsonPath: .status.message }
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                # Of the manifests, the bundle's config and what AXP gives it.
                revision: { type: string }
                protocol: { type: string }
                uses: { type: array, items: { type: string } }
                database: { type: boolean }
                manifests: { type: string }
            status:
              type: object
              properties:
                state: {
                  type: string,
                  enum: [applying, ready, incompatible, error],
                }
                message: { type: string }
                version: { type: string }
                revision: { type: string }
