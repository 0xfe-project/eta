# Vite SPA and static assets; reached only through the gateway.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  selector: { matchLabels: { app: web } }
  template:
    metadata: { labels: { app: web } }
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      containers:
        - name: web
          image: axp
          command: [bun, /app/apps/web/server.js]
          envFrom: [{ configMapRef: { name: axp } }]
          env:
            - name: SENTRY_DSN
              valueFrom: {
                secretKeyRef: { name: axp, key: SENTRY_DSN, optional: true },
              }
          ports: [{ containerPort: 3000 }]
          readinessProbe:
            tcpSocket: { port: 3000 }
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector: { app: web }
  ports: [{ port: 3000 }]
