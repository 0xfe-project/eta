# AXP itself, in production's namespace (axp): the gateways, web, the
# control plane's three processes, and their permissions. deploy.sh sets
# the image (axp) and makes the Secrets axp and infra and the ConfigMap axp.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - gateways.yaml
  - web.yaml
  - control-plane.yaml
  - rbac.yaml
  - backup.yaml
