# The control plane (apps/control-plane), one binary in three processes.
# Every one reads the Secret axp (keys, the database, S3) and the ConfigMap
# axp (version, public address, S3) that deploy.sh writes.
#
# api: both APIs and the models, each API on its own listener: the public
# one (:8000) reached only by the gateway, the internal one (:8001) by the
# runtime gateway, the routine worker and the controller. The GitHub App's
# credentials (forge) and the models' accounts (llm) are on its volumes,
# so one runs at a time. Chat streams (SSE) reconnect with Last-Event-ID.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: forge
spec:
  storageClassName: axp
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 1Gi } }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: llm
spec:
  storageClassName: axp
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 1Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  strategy: { type: Recreate }
  selector: { matchLabels: { app: api } }
  template:
    metadata: { labels: { app: api } }
    spec:
      serviceAccountName: api
      enableServiceLinks: false
      containers:
        - name: api
          image: axp
          command: [axp-control-plane, serve]
          envFrom: [
            { configMapRef: { name: axp } },
            { secretRef: { name: axp } },
          ]
          env:
            - { name: AXP_FORGE_STATE_DIR, value: /app/var/forge }
            - { name: AXP_LLM_STATE_DIR, value: /app/var/llm }
          ports: [{ containerPort: 8000 }, { containerPort: 8001 }]
          readinessProbe:
            httpGet: { path: /api/health, port: 8000 }
            periodSeconds: 2
          volumeMounts:
            - { name: forge, mountPath: /app/var/forge }
            - { name: llm, mountPath: /app/var/llm }
      volumes:
        - { name: forge, persistentVolumeClaim: { claimName: forge } }
        - { name: llm, persistentVolumeClaim: { claimName: llm } }
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector: { app: api }
  ports:
    - { name: public, port: 8000 }
    - { name: internal, port: 8001 }
---
# Routines' runs: takes their fires from NATS and runs each as an ADK agent,
# and revises briefs from feedback. One at a time: a new one waits for the
# old one's lock; the old one records its runs as interrupted when it stops.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: routine-worker
spec:
  strategy: { type: Recreate }
  selector: { matchLabels: { app: routine-worker } }
  template:
    metadata: { labels: { app: routine-worker } }
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: routine-worker
          image: axp
          command: [axp-control-plane, routine-worker]
          envFrom: [
            { configMapRef: { name: axp } },
            { secretRef: { name: axp } },
          ]
---
# Agents' runtimes (Pods in axp-agents, images built by buildkitd into the
# registry), bundles' services (axp-bundles), delivering work and importing
# events. It holds a lock; a new one waits until the old one stopped, which
# finishes the tick in progress.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller
spec:
  strategy: { type: Recreate }
  selector: { matchLabels: { app: controller } }
  template:
    metadata: { labels: { app: controller } }
    spec:
      serviceAccountName: controller
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: controller
          image: axp
          command: [axp-control-plane, controller]
          envFrom: [
            { configMapRef: { name: axp } },
            { secretRef: { name: axp } },
          ]
