# Every night, a dump of every database (the control plane's, routines',
# bundles' services') to the volume backups, the last 7 kept. The other
# volumes (deploy/k3s/README.md) are copied off the node by hand.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backups
spec:
  storageClassName: axp
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 20Gi } }
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup
spec:
  schedule: "0 4 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: dump
              image: pgvector/pgvector:pg17-trixie
              command:
                - sh
                - -c
                - >-
                  pg_dumpall -h postgres -U axp | gzip >/backups/axp-$(date +%F).sql.gz &&
                  ls -1t /backups/axp-*.sql.gz | tail -n +8 | xargs -r rm --
              env:
                - name: PGPASSWORD
                  valueFrom: {
                    secretKeyRef: { name: infra, key: POSTGRES_PASSWORD },
                  }
              volumeMounts: [{ name: backups, mountPath: /backups }]
          volumes: [
            { name: backups, persistentVolumeClaim: { claimName: backups } },
          ]
