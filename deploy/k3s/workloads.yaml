# The namespaces agents' runtimes and bundles' services run in, for one
# AXP: NAMESPACE-agents and NAMESPACE-bundles (deploy.sh: axp; scripts/dev.sh:
# dev-<database>). They take connections only from AXP's own namespaces
# (and the node, where development's processes run), and reach of AXP's
# only the runtime gateway and NATS (deploy/k3s/infra). The
# controller manages agents' Pods and volumes and bundles' services there,
# and the API reads how those are; neither can touch anything else (in
# development both run on the host as the cluster's administrator).
apiVersion: v1
kind: Namespace
metadata:
  name: NAMESPACE-agents
  labels:
    axp.dev/role: agents
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: Namespace
metadata:
  name: NAMESPACE-bundles
  labels:
    axp.dev/role: bundles
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: from-axp
  namespace: NAMESPACE-agents
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from: [{ namespaceSelector: { matchLabels: { axp.dev/role: platform } } }]
---
# A bundle's pods also reach each other.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: from-axp
  namespace: NAMESPACE-bundles
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { axp.dev/role: platform } }
        - podSelector: {}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: axp-controller
  namespace: NAMESPACE-agents
rules:
  - apiGroups: [""]
    resources: [pods, persistentvolumeclaims]
    verbs: [get, list, watch, create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: axp-controller
  namespace: NAMESPACE-agents
roleRef: {
  apiGroup: rbac.authorization.k8s.io,
  kind: Role,
  name: axp-controller,
}
subjects: [{ kind: ServiceAccount, name: controller, namespace: NAMESPACE }]
---
# The kinds a bundle's service may have (internal/bundles/service.go).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: axp-controller
  namespace: NAMESPACE-bundles
rules:
  - apiGroups: [""]
    resources: [
      configmaps,
      persistentvolumeclaims,
      secrets,
      services,
      serviceaccounts,
    ]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [axp.dev]
    resources: [bundleservices, bundleservices/status]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: axp-controller
  namespace: NAMESPACE-bundles
roleRef: {
  apiGroup: rbac.authorization.k8s.io,
  kind: Role,
  name: axp-controller,
}
subjects: [{ kind: ServiceAccount, name: controller, namespace: NAMESPACE }]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: axp-api
  namespace: NAMESPACE-bundles
rules:
  - apiGroups: [axp.dev]
    resources: [bundleservices]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: axp-api
  namespace: NAMESPACE-bundles
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: axp-api }
subjects: [{ kind: ServiceAccount, name: api, namespace: NAMESPACE }]
