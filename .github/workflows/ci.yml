# Everything pre-commit checks (bun run check), for every pull request and
# every push to main: squash merges, `--no-verify` and bots skip the hook.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Tests that need a tool fail instead of skipping without it.
      CI: "1"
      AXP_TEST_NATS_URL: nats://127.0.0.1:14222
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/control-plane/go.mod
          cache-dependency-path: "**/go.sum"
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vendor/akhook

      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      # The queue tests' NATS. PostgreSQL comes from scripts/dev-postgres.sh,
      # which the tests that need it run themselves.
      - name: Start NATS
        run: docker run -d --name nats -p 127.0.0.1:14222:4222 nats:2.14-alpine --jetstream

      - run: bun install --frozen-lockfile
      - run: bun run check
