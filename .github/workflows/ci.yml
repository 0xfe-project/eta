# Everything pre-commit checks (bun run check), for every pull request and
# every push to main: squash merges, `--no-verify` and bots skip the hook.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      # The Remote Cache token is exchanged for the job's OIDC token.
      id-token: write
    env:
      # Tests that need a tool fail instead of skipping without it.
      CI: "1"
    steps:
      - uses: actions/checkout@v7

      # Turborepo's Remote Cache (turbo.json's remoteCache), which development
      # machines fill as they commit: a short-lived token for the Vercel team,
      # through its OIDC policy for this repository. Without one the run only
      # goes uncached.
      - name: Turborepo Remote Cache
        uses: vercel/setup-turborepo-remote-cache-action@v1.1.0
        continue-on-error: true
        with:
          team: team_m0cGPvm66wsuOjDpnCrXUDPz

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      # Bun's package store; uv's is cached by its setup action above.
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile
      - run: bun run check
