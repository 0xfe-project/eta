# A `v*` tag becomes a GitHub Release of the host: for each platform the host as one file, with
# eta-host.json and SHA256SUMS. The desktop app is released apart, from `desktop-v*` tags
# (release-desktop.yml). How to cut either is in docs/release.md.
name: Release

on:
  push:
    tags: ["v*"]
  # For a tag whose run never happened or was lost, by naming it as the ref:
  # `gh workflow run release.yml --ref v0.2.0`.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: read

env:
  TAG: ${{ github.ref_name }}
  GH_REPO: ${{ github.repository }}

jobs:
  # All of it: --affected compares with main, and a tag on main has nothing to compare.
  check:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      id-token: write
    with:
      command: check

  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Read the version from the tag
        id: version
        run: |
          if [[ $GITHUB_REF_TYPE != tag || ! $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::A release runs on a tag like v0.2.0, not on $GITHUB_REF."
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # The builds upload to a draft, so nobody sees a release before it is whole. A
      # published release keeps its files: a new build means a new tag.
      - name: Open the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          draft=$(gh release view "$TAG" --json isDraft --jq .isDraft || echo none)
          if [[ $draft == false ]]; then
            echo "::error::$TAG is already published."
            exit 1
          fi
          if [[ $draft == none ]]; then
            gh release create "$TAG" --draft --verify-tag --title "$TAG" --generate-notes \
              --prerelease="$([[ $TAG == *-* ]] && echo true || echo false)"
          fi

  build:
    needs: prepare
    strategy:
      # The others finish, so a rerun is only of the one that failed.
      fail-fast: false
      matrix:
        # Each platform builds on a runner of its own: the host carries the CLIProxyAPI
        # of the machine that compiled it.
        include:
          - platform: linux-x64
            runner: ubuntu-latest
          - platform: darwin-arm64
            runner: macos-latest
          - platform: windows-x64
            runner: windows-latest
            exe: .exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        # Git's bash on Windows, so every platform runs the same steps.
        shell: bash
    env:
      HOST: eta-host${{ matrix.exe }}
      ASSET: eta-host-${{ matrix.platform }}${{ matrix.exe }}
      ETA_DAEMON_VERSION: ${{ needs.prepare.outputs.version }}
      # The repository a build upgrades from: this one, so a fork's builds follow the fork.
      ETA_HOST_UPSTREAM: ${{ github.api_url }}/repos/${{ github.repository }}
    steps:
      # What is built is what is in git: Windows runners would check out CRLF.
      - run: git config --global core.autocrlf false

      # Dependencies' code runs here too, in a job that can write releases.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run --cwd apps/web build
      - run: bun apps/eta/scripts/build-host.ts

      - name: Run the file on its own
        run: |
          expected="eta-host $ETA_DAEMON_VERSION ($(git rev-parse --short=12 HEAD))"
          mkdir -p "$RUNNER_TEMP/try/home"
          cp "apps/eta/out/host/$HOST" "$RUNNER_TEMP/try/$ASSET"
          cd "$RUNNER_TEMP/try"

          actual=$("./$ASSET" --version)
          if [[ $actual != "$expected" ]]; then
            echo "::error::--version says '$actual', not '$expected'."
            exit 1
          fi

          if ! "./$ASSET" upgrade --help | grep "this build follows:" | grep -qF "$GH_REPO"; then
            echo "::error::The build does not follow $GH_REPO."
            exit 1
          fi

          # USERPROFILE is what a home directory is on Windows.
          HOME="$PWD/home" USERPROFILE="$PWD/home" "./$ASSET" --port 18787 &
          curl -fsS --retry 30 --retry-delay 1 --retry-all-errors http://127.0.0.1:18787/up
          curl -fsS -o /dev/null http://127.0.0.1:18787/
          kill $!

      # Once per release: what the build says about itself, with the oldest desktop app its page
      # works in, for the app to pick a host without downloading one.
      - name: Describe the build
        if: matrix.platform == 'linux-x64'
        run: |
          cd "$RUNNER_TEMP/try"
          "./$ASSET" --version --json > eta-host.json
          if [[ $(jq -r .version eta-host.json) != "$ETA_DAEMON_VERSION" ]]; then
            echo "::error::eta-host.json does not say $ETA_DAEMON_VERSION:"
            cat eta-host.json
            exit 1
          fi
          cat eta-host.json

      - name: The build left the checkout as it was
        run: |
          changed=$(git status --porcelain)
          if [[ -n $changed ]]; then
            echo "::error::The checkout changed during the build:"
            echo "$changed"
            exit 1
          fi

      - name: Upload them to the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/try"
          files=("$ASSET")
          if [[ -f eta-host.json ]]; then files+=(eta-host.json); fi
          gh release upload "$TAG" "${files[@]}" --clobber

  # From the last release to this draft, on Linux: a release is what people upgrade to. macOS and
  # Windows are `gh workflow run upgrade-cross.yml -f platforms=all`, by hand.
  cross:
    needs: [prepare, build]
    uses: ./.github/workflows/upgrade-cross.yml
    permissions:
      contents: write
    with:
      to: ${{ needs.prepare.outputs.version }}

  # `check` runs beside the builds: nothing is published until both are through, and neither has
  # anything to wait for from the other.
  publish:
    needs: [check, cross]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # From the draft, so the sums are of what people will download.
      - name: Add SHA256SUMS
        run: |
          gh release download "$TAG" --pattern 'eta-host*' --dir assets
          cd assets
          sha256sum eta-host* | tee SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --clobber

      - run: gh release edit "$TAG" --draft=false
