# A `desktop-v*` tag becomes a GitHub Release of the desktop app: an installer for each platform,
# and SHA256SUMS. The host is released apart, from `v*` tags (release.yml). How to cut either is
# in docs/release.md.
name: Release desktop

on:
  push:
    tags: ["desktop-v*"]
  # For a tag whose run never happened or was lost, by naming it as the ref:
  # `gh workflow run release-desktop.yml --ref desktop-v0.2.0`.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: read

env:
  TAG: ${{ github.ref_name }}
  GH_REPO: ${{ github.repository }}

jobs:
  # All of it: --affected compares with main, and a tag on main has nothing to compare.
  check:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      id-token: write
    with:
      all: true

  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Read the version from the tag
        id: version
        run: |
          if [[ $GITHUB_REF_TYPE != tag || ! $TAG =~ ^desktop-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::A desktop release runs on a tag like desktop-v0.2.0, not on $GITHUB_REF."
            exit 1
          fi
          echo "version=${TAG#desktop-v}" >> "$GITHUB_OUTPUT"

      # Never the repository's Latest: that is the host's, and what `eta-host upgrade` and the
      # install instructions mean by the latest release (apps/eta/src/upgrade/releases.ts only
      # takes v* tags in any case).
      - name: Open the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          draft=$(gh release view "$TAG" --json isDraft --jq .isDraft || echo none)
          if [[ $draft == false ]]; then
            echo "::error::$TAG is already published."
            exit 1
          fi
          # A pre-release by its version: the tag itself always has a `-` in it.
          if [[ $draft == none ]]; then
            gh release create "$TAG" --draft --verify-tag --title "eta desktop ${TAG#desktop-v}" \
              --generate-notes --latest=false \
              --prerelease="$([[ ${TAG#desktop-v} == *-* ]] && echo true || echo false)"
          fi

  build:
    needs: prepare
    strategy:
      # The others finish, so a rerun is only of the one that failed.
      fail-fast: false
      matrix:
        include:
          - target: linux
            runner: ubuntu-latest
            desktop: eta-desktop-linux-x64.tar.gz
          - target: macos
            runner: macos-latest
            desktop: eta-desktop-darwin-arm64.dmg
          - target: windows
            runner: windows-latest
            desktop: eta-desktop-windows-x64.zip
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        # Git's bash on Windows, so every platform runs the same steps.
        shell: bash
    env:
      DESKTOP: ${{ matrix.desktop }}
      ETA_DESKTOP_VERSION: ${{ needs.prepare.outputs.version }}
      # The app downloads its host from this repository, so a fork's app follows the fork.
      ETA_HOST_UPSTREAM: ${{ github.api_url }}/repos/${{ github.repository }}
      ETA_DESKTOP_TARGET: ${{ matrix.target }}
      ETA_CLIENT_UPDATE_URL: ${{ vars.ETA_CLIENT_UPDATE_URL }}
      ETA_CLIENT_UPDATE_PUBLIC_KEY: ${{ vars.ETA_CLIENT_UPDATE_PUBLIC_KEY }}
    steps:
      # What is built is what is in git: Windows runners would check out CRLF.
      - run: git config --global core.autocrlf false

      # Dependencies' code runs here too, in a job that can write releases.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile --ignore-scripts

      - uses: ./.github/actions/setup-nsh

      - name: Package the app
        run: |
          out="$RUNNER_TEMP/eta-desktop"
          mkdir -p "$out" "$RUNNER_TEMP/try"
          bun run client:package --target "$ETA_DESKTOP_TARGET" \
            --app-version "$ETA_DESKTOP_VERSION" --out "$out"
          case "$ETA_DESKTOP_TARGET" in
            macos)
              codesign --verify --deep "$out/Eta.app"
              test -x "$out/Eta.app/Contents/Resources/nsh/eta-bootstrap"
              mkdir -p "$RUNNER_TEMP/eta-dmg"
              ditto "$out/Eta.app" "$RUNNER_TEMP/eta-dmg/Eta.app"
              hdiutil create -volname Eta -srcfolder "$RUNNER_TEMP/eta-dmg" -format UDZO "$RUNNER_TEMP/try/$DESKTOP"
              ;;
            linux)
              test -x "$out/Eta/nsh/eta-bootstrap"
              cp "$out/Eta.tar.gz" "$RUNNER_TEMP/try/$DESKTOP"
              ;;
            windows)
              test -f "$out/Eta/eta-bootstrap.exe"
              cp "$out/Eta.zip" "$RUNNER_TEMP/try/$DESKTOP"
              ;;
          esac

      - name: The build left the checkout as it was
        run: |
          changed=$(git status --porcelain)
          if [[ -n $changed ]]; then
            echo "::error::The checkout changed during the build:"
            echo "$changed"
            exit 1
          fi

      - name: Upload it to the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" "$RUNNER_TEMP/try/$DESKTOP" --clobber
          if [[ -n "$ETA_CLIENT_UPDATE_URL" ]]; then
            gh release upload "$TAG" "$RUNNER_TEMP/eta-desktop"/Eta-"$ETA_DESKTOP_VERSION"-"$ETA_DESKTOP_TARGET"-* --clobber
          fi

  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # From the draft, so the sums are of what people will download.
      - name: Add SHA256SUMS
        run: |
          gh release download "$TAG" --pattern 'eta-desktop-*' --dir assets
          cd assets
          sha256sum eta-desktop-* | tee SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --clobber

      # Publishing makes a release the Latest unless told otherwise.
      - run: gh release edit "$TAG" --draft=false --latest=false
