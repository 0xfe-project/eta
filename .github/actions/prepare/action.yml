# What CI (ci.yml) needs before it runs its turbo tasks: optional uv (when @eta/memory
# is in the plan), workspace packages, and the OS runner's Turborepo cache. Bun itself
# and the checkout come first, in the workflow, because `plan` needs them.
name: Prepare a CI runner
description: Set up uv when needed, install workspace packages, and restore Turborepo cache.

inputs:
  setup-uv:
    description: Whether to install Python/uv and sync apps/memory before Turbo runs.
    default: "false"
  restore-turbo-cache:
    description: Whether to restore .turbo/cache for this OS runner.
    default: "true"

outputs:
  turbo-cache-key:
    description: The key to save this OS runner's Turborepo cache under once tasks finish.
    value: ${{ steps.turbo-key.outputs.key }}

runs:
  using: composite
  steps:
    - if: inputs.setup-uv == 'true'
      uses: astral-sh/setup-uv@v10.2.0
      with:
        # apps/memory/.python-version.
        python-version: "3.13"
        cache-python: true
        enable-cache: true
        cache-dependency-glob: "**/uv.lock"
        save-cache: true
        ignore-nothing-to-cache: true

    - name: Sync apps/memory
      if: inputs.setup-uv == 'true'
      shell: bash
      run: uv sync --project apps/memory --frozen --dev

    # No cache of Bun's package store: restoring its 480 MB took longer (10 s, then 2 s
    # to link) than installing from the registry (5-7 s).
    - run: bun install --frozen-lockfile --ignore-scripts
      shell: bash

    - name: Name the Turborepo cache
      id: turbo-key
      shell: bash
      run: echo "key=turbo-$RUNNER_OS-$GITHUB_SHA-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

    - name: Restore Turborepo
      if: inputs.restore-turbo-cache == 'true'
      uses: actions/cache/restore@v6
      with:
        path: .turbo/cache
        key: ${{ steps.turbo-key.outputs.key }}
        restore-keys: |
          turbo-${{ runner.os }}-${{ github.sha }}-
          turbo-${{ runner.os }}-
