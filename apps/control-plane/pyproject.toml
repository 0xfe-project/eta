[project]
name = "axp-control-plane"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "boto3>=1.40,<2",
  "dj-database-url>=3.0,<4",
  "django>=5.2,<5.3",
  "django-ninja>=1.4,<2",
  "docker>=7.1,<8",
  "gunicorn>=23,<24",
  "jsonschema>=4.25,<5",
  "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1.1,<2",
]

[dependency-groups]
dev = ["ruff>=0.14,<1"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*" = ["E501"]
