# The agenvo relay (apps/agenvo) that remote computers' connectors pair with,
# public at AXP's address under /remote/relay (the gateway's route to the
# Service agenvo); it authenticates devices itself. Its administrator secret
# is the one AXP derives for the bundle, which the control plane derives too
# to manage it. One process owns its SQLite state on the volume.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agenvo-relay
spec:
  storageClassName: axp
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 1Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agenvo-relay
spec:
  strategy: { type: Recreate }
  selector: { matchLabels: { app: agenvo-relay } }
  template:
    metadata: { labels: { app: agenvo-relay } }
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext: { fsGroup: 1000 }
      containers:
        - name: relay
          image: axp-relay
          command:
            - sh
            - -c
            - >-
              printf '{"baseUrl": "%s/remote/relay", "dataDir": "/home/node/data", "host": "0.0.0.0",
              "port": 8080, "trustedProxy": true}' "${AXP_PUBLIC_URL:-https://relay.invalid}" >/tmp/relay.json &&
              exec node /opt/agenvo/node_modules/@agenvo/server/dist/cli.js serve --config /tmp/relay.json
          env:
            - name: AGENVO_ADMIN_SECRET
              valueFrom: {
                secretKeyRef: { name: axp-agenvo, key: AXP_BUNDLE_SECRET },
              }
            - name: AXP_PUBLIC_URL
              valueFrom: {
                secretKeyRef: { name: axp-agenvo, key: AXP_PUBLIC_URL },
              }
          ports: [{ containerPort: 8080 }]
          readinessProbe:
            tcpSocket: { port: 8080 }
          volumeMounts: [{ name: home, mountPath: /home/node }]
      volumes: [
        { name: home, persistentVolumeClaim: { claimName: agenvo-relay } },
      ]
---
apiVersion: v1
kind: Service
metadata:
  name: agenvo
spec:
  selector: { app: agenvo-relay }
  ports: [{ name: http, port: 80, targetPort: 8080 }]
