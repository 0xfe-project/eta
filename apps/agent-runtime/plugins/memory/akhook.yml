# The memory plugin's hooks, as akhook rules (docs/architecture/plugins.md):
# recall adds the memories relevant to a prompt to the turn's context;
# capture sends the finished turn to be remembered.
version: 1
rules:
  - id: recall
    on: prompt_submit
    run:
      argv: [python, "${PLUGIN_ROOT}/hooks/memory.py", recall]
      timeout_ms: 5000
  - id: capture
    on: stop
    run:
      argv: [python, "${PLUGIN_ROOT}/hooks/memory.py", capture]
      timeout_ms: 5000
