[project]
name = "axp-agent-runtime"
version = "0.1.0"
description = "Per-agent runtime that drives Codex through the official Python SDK."
requires-python = ">=3.13,<3.14"
dependencies = ["mcp>=1.20,<2", "openai-codex==0.160.1"]

[dependency-groups]
dev = [
  "dirty-equals>=0.11",
  "pytest>=9.1.1",
  "ruff>=0.14,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# The Codex SDK's pydantic models warn on serialization; not test failures.
filterwarnings = ["ignore:Pydantic serializer warnings:UserWarning"]
addopts = "-p no:cacheprovider"
