[project]
name = "axp-agent-runtime"
version = "0.1.0"
description = "Per-agent runtime that drives Codex through the official Python SDK."
requires-python = ">=3.13,<3.14"
dependencies = ["mcp>=1.20,<2", "openai-codex==0.160.1"]

[dependency-groups]
dev = ["ruff>=0.14,<1"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
