id: design-number
valid:
  - "const a = { padding: 0, margin: 1, borderWidth: 1, opacity: 1 };"
  - "const a = { marginTop: -1 };"
  - "const a = { width: '100%', height: \"100%\" };"
  - "const a = { padding: space[8], gap: inset, width: sizes.panel };"
  - "const a = { width: props.width ?? sizes.panel };"
  - "const a = { width: (54 * used) / 100 };"
  - "const a = { marginLeft: 6 - (props.gap ?? 4) };"
  - "const a = { x: 0, y: 8, blur: 24 };"
  - "const a = { top: 8, left: 12, flex: 1, borderRadius: 4 };"
  - "const a = { maxLength: 100, minimum: 3 };"
  - "<Icon name=\"plus\" size={icon.md} />"
  - "<Button iconSize={props.iconSize} />"
  - "<Modal width={dialogWidth.md} />"
  - "<Header inset={space[16]} end={phone() ? space[8] : undefined} />"
  - "<Row end=\"return\" />"
  - "<Bar width=\"100%\" height={barHeight.line} />"
  - "const a = { fontWeight: weight.strong, letterSpacing: tracking.caps };"
invalid:
  - "const a = { padding: 8 };"
  - "const a = { paddingHorizontal: 12 };"
  - "const a = { marginTop: -8 };"
  - "const a = { gap: 6 };"
  - "const a = { width: 320, height: 40 };"
  - "const a = { minWidth: 0, maxWidth: 560 };"
  - "const a = { borderBottomWidth: 2 };"
  - "const a = { opacity: 0.45 };"
  - "const a = { zIndex: 10 };"
  - "const a = { letterSpacing: 0.4 };"
  - "const a = { fontWeight: 600 };"
  - "const a = { fontWeight: \"700\" };"
  - "const a = { width: \"50%\" };"
  - "const a = { padding: phone() ? 16 : 12 };"
  - "const a = { gap: props.gap ?? 8 };"
  - "const a = { height: open() && 24 };"
  - "const a = { width: (phone() ? 64 : sizes.rail) };"
  - "const a = { \"padding\": 4 };"
  - "<Icon name=\"plus\" size={14} />"
  - "<Button iconSize={phone() ? 16 : 12} />"
  - "<Modal width={448} />"
  - "<Empty descriptionWidth={320} />"
  - "<Bar width={96} height={phone() ? 12 : 10} />"
  - "<Header inset={14} end={10} />"
