# The OpenAPI document the web client's types come from (`bun run generate`):
# the host writes it from the code that answers the routes (`bun run --cwd
# apps/eta openapi`), so the client can never drift from the server.
apis:
  eta:
    root: ../eta/out/openapi.json
    x-openapi-ts:
      output: ./src/api/eta.gen.ts
  # The compat layer's contract, frozen: these shapes are what the host's compat plugin
  # serves on /api/v1 (and the routines plugin on /api/routines/v1), but the host's own
  # document does not describe all of them yet (REFACTOR.md P2.5's boundary). The two
  # snapshots below come from the old stack's exporter, kept verbatim as the wire
  # contract the web still compiles against; each shape moves to eta.gen as its route's
  # description is ported, and these files shrink until they are gone.
  compat:
    root: ./openapi/compat.json
    x-openapi-ts:
      output: ./src/api/control-plane.gen.ts
  routines:
    root: ./openapi/routines.json
    x-openapi-ts:
      output: ./src/api/routines.gen.ts
