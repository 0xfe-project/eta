# The OpenAPI document the web client's types come from (`bun run generate`).
# It is a frozen snapshot of the old stack's contract: the web still compiles
# against these shapes while its data layer moves to the host's WebSocket
# protocol (@eta/client-contracts) feature by feature. The snapshot shrinks as
# its queries are ported, and this file goes with the last of it.
apis:
  compat:
    root: ./openapi/compat.json
    x-openapi-ts:
      output: ./src/api/control-plane.gen.ts
