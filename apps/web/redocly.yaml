# The OpenAPI documents the web client's types come from (`bun run generate`).
# Both are frozen snapshots of the old stack's contract: the web still compiles
# against these shapes while its data layer moves to the host's WebSocket
# protocol (@eta/client-contracts) feature by feature. Each snapshot shrinks as
# its queries are ported, and this file goes with the last one.
apis:
  compat:
    root: ./openapi/compat.json
    x-openapi-ts:
      output: ./src/api/control-plane.gen.ts
  routines:
    root: ./openapi/routines.json
    x-openapi-ts:
      output: ./src/api/routines.gen.ts
