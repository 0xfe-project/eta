# The services whose OpenAPI documents the web client's types come from
# (`bun run generate`, after each service's `openapi` task). Adding a service:
# an entry here, its `openapi` task in turbo.json's generate, and a client in
# src/lib/api.ts.
apis:
  control-plane:
    root: ../control-plane/out/openapi.json
    x-openapi-ts:
      output: ./src/api/control-plane.gen.ts
  routines:
    root: ../routine-service/out/openapi.json
    x-openapi-ts:
      output: ./src/api/routines.gen.ts
