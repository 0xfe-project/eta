[project]
name = "axp-forge-service"
version = "0.1.0"
description = "Code hosting (GitHub App) for agents, behind the gateways."
requires-python = ">=3.13,<3.14"
dependencies = [
  "axp-telemetry",
  "httpx>=0.28",
  "mcp>=1.20,<2",
  "pyjwt[crypto]>=2.10,<3",
  "uvicorn>=0.35",
]

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "ruff>=0.14,<1",
]

[tool.uv]
package = false

[tool.uv.sources]
axp-telemetry = { path = "../../packages/telemetry-py", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"
