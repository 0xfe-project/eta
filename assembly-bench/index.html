<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>装配台 · ASSEMBLY BENCH</title>
<style>
  :root{
    --ink:#0b1016;
    --grid:#16222e;
    --grid2:#1d2f40;
    --line:#2f4256;
    --cy:#4fd6ff;
    --am:#ffb547;
    --ok:#5ef0a8;
    --dim:#7e93a8;
    --fg:#dbe7f2;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--ink);
    color:var(--fg);
    font-family:var(--mono);
    font-size:13px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    background-image:
      linear-gradient(var(--grid) 1px,transparent 1px),
      linear-gradient(90deg,var(--grid) 1px,transparent 1px),
      linear-gradient(var(--grid2) 1px,transparent 1px),
      linear-gradient(90deg,var(--grid2) 1px,transparent 1px);
    background-size:16px 16px,16px 16px,96px 96px,96px 96px;
    background-position:-1px -1px;
  }
  .wrap{max-width:1040px;margin:0 auto;padding:28px 20px 64px}

  header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;
    border-bottom:1px solid var(--line);padding-bottom:14px}
  .title{font-size:20px;letter-spacing:.16em;font-weight:600}
  .title b{color:var(--cy)}
  .sub{color:var(--dim);font-size:11px;letter-spacing:.22em;text-transform:uppercase}
  .stamp{border:1px solid var(--line);padding:6px 10px;font-size:10px;letter-spacing:.18em;color:var(--dim)}
  .stamp b{color:var(--am)}

  .grid{display:grid;grid-template-columns:300px 1fr;gap:18px;margin-top:22px}
  @media(max-width:820px){.grid{grid-template-columns:1fr}}

  .panel{border:1px solid var(--line);background:rgba(9,15,21,.72);position:relative}
  .panel>h2{font-size:10px;letter-spacing:.22em;color:var(--dim);font-weight:600;
    padding:9px 12px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.02);
    display:flex;justify-content:space-between;align-items:center}
  .panel>h2 span{color:var(--cy)}

  /* ---- parts bin ---- */
  .bin{padding:10px;display:flex;flex-direction:column;gap:8px}
  .part{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;
    border:1px dashed var(--line);padding:9px 10px;cursor:pointer;
    transition:border-color .15s,background .15s,transform .1s;background:rgba(79,214,255,.02)}
  .part:hover{border-color:var(--cy);background:rgba(79,214,255,.07)}
  .part:active{transform:translateX(2px)}
  .part .id{color:var(--dim);font-size:10px;text-align:center}
  .part .nm{font-size:12px}
  .part .ds{font-size:10px;color:var(--dim);letter-spacing:.04em}
  .part .tag{font-size:9px;letter-spacing:.14em;color:var(--dim);border:1px solid var(--line);padding:1px 5px}
  .part.on{border-style:solid;border-color:rgba(94,240,168,.5);background:rgba(94,240,168,.06);cursor:default}
  .part.on .nm{color:var(--ok)}
  .part.on .tag{border-color:rgba(94,240,168,.4);color:var(--ok)}
  .part.on .id::after{content:"✓"}
  .part.on .id{color:var(--ok);font-size:0}
  .part.on .id::after{font-size:10px}

  /* ---- engine / slots ---- */
  .bench{padding:16px;min-height:340px;display:flex;flex-direction:column;gap:12px}
  .core{border:1px solid var(--line);padding:14px;position:relative;flex:1;
    display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .core::before{content:"";position:absolute;inset:6px;border:1px dotted var(--grid2);pointer-events:none}
  .slot{border:1px dashed var(--grid2);position:relative;min-height:96px;padding:12px;
    display:flex;flex-direction:column;justify-content:center;gap:6px;overflow:hidden}
  .slot .lbl{position:absolute;top:8px;left:10px;font-size:9px;letter-spacing:.18em;color:var(--grid2)}
  .slot .ghost{color:#243546;font-size:22px;letter-spacing:.1em;text-align:center}
  .slot .fill{opacity:0;transform:translateY(8px) scale(.98);transition:.35s cubic-bezier(.2,.8,.2,1)}
  .slot.lit{border-style:solid;border-color:rgba(79,214,255,.45);background:
    repeating-linear-gradient(-45deg,rgba(79,214,255,.05) 0 8px,transparent 8px 16px)}
  .slot.lit .fill{opacity:1;transform:none}
  .slot.lit .ghost{opacity:0}
  .slot .fill b{display:block;font-size:13px;color:var(--cy)}
  .slot .fill em{font-style:normal;font-size:10px;color:var(--dim)}
  .slot .bolt{position:absolute;width:5px;height:5px;background:var(--line)}
  .slot .bolt:nth-child(1){top:4px;left:4px}
  .slot .bolt:nth-child(2){top:4px;right:4px}
  .slot .bolt:nth-child(3){bottom:4px;left:4px}
  .slot .bolt:nth-child(4){bottom:4px;right:4px}
  .slot.lit .bolt{background:var(--cy)}

  .meters{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;
    border:1px solid var(--line);padding:11px 12px}
  .bar{height:6px;background:#0f1a24;border:1px solid var(--line);position:relative;overflow:hidden}
  .bar i{position:absolute;inset:0;width:0;background:linear-gradient(90deg,var(--cy),var(--ok));
    transition:width .45s cubic-bezier(.2,.8,.2,1)}
  .pct{font-size:16px;letter-spacing:.08em;color:var(--dim);min-width:56px;text-align:right}
  .pct.full{color:var(--ok)}
  .note{font-size:11px;color:var(--dim)}
  .note b{color:var(--am)}

  /* ---- pipeline ---- */
  .pipe{margin-top:18px}
  .flow{display:flex;align-items:center;gap:0;padding:14px 12px;overflow-x:auto}
  .stage{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
  .stage .box{border:1px solid var(--line);padding:7px 9px;font-size:10px;letter-spacing:.12em;
    white-space:nowrap;color:var(--dim);position:relative}
  .stage.hot .box{border-color:var(--am);color:var(--am);box-shadow:0 0 0 3px rgba(255,181,71,.08)}
  .stage.done .box{border-color:rgba(94,240,168,.45);color:var(--ok)}
  .stage .arrow{flex:1;height:1px;background:var(--line);min-width:14px;margin:0 6px;position:relative}
  .stage .arrow::after{content:"";position:absolute;right:0;top:-3px;border:3px solid transparent;border-left-color:var(--line)}
  .chip{width:7px;height:7px;background:var(--cy);position:absolute;border-radius:1px}

  footer{margin-top:22px;border-top:1px solid var(--line);padding-top:12px;
    display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
    font-size:10px;letter-spacing:.14em;color:#4e627a;text-transform:uppercase}
  .keys{color:var(--dim)}
  kbd{border:1px solid var(--line);padding:0 4px;font-family:inherit;font-size:9px;color:var(--fg)}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <div class="title">ETA <b>装配台</b></div>
      <div class="sub">assembly bench · 单页演示 · 无外部依赖</div>
    </div>
    <div class="stamp">DWG NO. <b>ETA-ASSY-001</b> · REV A</div>
  </header>

  <div class="grid">

    <section class="panel">
      <h2>零件箱 / PARTS BIN <span id="binCount">0/4</span></h2>
      <div class="bin" id="bin"></div>
    </section>

    <section class="panel">
      <h2>主机 / MAIN ASSEMBLY <span>CLICK LEFT → FIT</span></h2>
      <div class="bench">
        <div class="core" id="core"></div>
        <div class="meters">
          <div>
            <div class="note" id="note">等待装配 · 点左侧任意零件开始</div>
            <div class="bar"><i id="fill"></i></div>
          </div>
          <div class="pct" id="pct">0%</div>
        </div>
      </div>
    </section>
  </div>

  <section class="panel pipe">
    <h2>流水线 / PIPELINE <span>SPACE 推进</span></h2>
    <div class="flow" id="flow"></div>
  </section>

  <footer>
    <div>ETA · ARTIFACT · SELF-CONTAINED HTML</div>
    <div class="keys"><kbd>空格</kbd> 推进流水线 · <kbd>R</kbd> 重置</div>
  </footer>
</div>

<script>
const PARTS = [
  {id:'A1', nm:'会话运行时',   ds:'session / turn loop',   tag:'CORE'},
  {id:'A2', nm:'工具层',       ds:'read · write · bash',   tag:'IO'},
  {id:'A3', nm:'任务板',       ds:'plan → assign → done',  tag:'FLOW'},
  {id:'A4', nm:'记忆',         ds:'kv / 长期事实',          tag:'STORE'},
];

const bin  = document.getElementById('bin');
const core = document.getElementById('core');
const fill = document.getElementById('fill');
const pct  = document.getElementById('pct');
const note = document.getElementById('note');
const bcount = document.getElementById('binCount');
let lit = 0;

PARTS.forEach((p,i)=>{
  const el = document.createElement('div');
  el.className = 'part';
  el.innerHTML = `<div class="id">${p.id}</div>
    <div><div class="nm">${p.nm}</div><div class="ds">${p.ds}</div></div>
    <div class="tag">${p.tag}</div>`;
  el.onclick = ()=>{
    if (el.classList.contains('on')) return;
    el.classList.add('on');
    const s = core.children[i];
    s.classList.add('lit');
    lit++;
    bcount.textContent = `${lit}/${PARTS.length}`;
    const v = Math.round(lit/PARTS.length*100);
    fill.style.width = v+'%';
    pct.textContent = v+'%';
    note.innerHTML = lit === PARTS.length
      ? '<b>装配完成</b> · 可以跑了。点右上零件已锁定,按 R 拆重来。'
      : `已装入 <b>${p.nm}</b> · 余 ${PARTS.length-lit} 件`;
    if (lit === PARTS.length) pct.classList.add('full');
  };
  bin.appendChild(el);

  const slot = document.createElement('div');
  slot.className = 'slot';
  slot.innerHTML = `<i class="bolt"></i><i class="bolt"></i><i class="bolt"></i><i class="bolt"></i>
    <div class="lbl">${p.id} · ${p.tag}</div>
    <div class="ghost">――</div>
    <div class="fill"><b>${p.nm}</b><em>${p.ds}</em></div>`;
  core.appendChild(slot);
});

/* ---- pipeline ---- */
const STAGES = ['backlog','todo','in_progress','in_review','done'];
const flow = document.getElementById('flow');
let cur = -1;
STAGES.forEach((s,i)=>{
  const d = document.createElement('div');
  d.className = 'stage';
  d.dataset.i = i;
  d.innerHTML = `<div class="box">${String(i+1).padStart(2,'0')} ${s.toUpperCase()}</div>` +
                (i < STAGES.length-1 ? '<div class="arrow"></div>' : '');
  flow.appendChild(d);
});
function step(){
  const boxes = [...flow.children];
  if (cur >= 0){ boxes[cur].classList.remove('hot'); boxes[cur].classList.add('done'); }
  cur++;
  if (cur >= STAGES.length){
    cur = -1;
    boxes.forEach(b=>b.classList.remove('hot','done'));
    return;
  }
  boxes[cur].classList.add('hot');
  const arrow = boxes[cur].querySelector('.arrow');
  if (arrow){
    const c = document.createElement('i');
    const span = Math.max(arrow.clientWidth - 7, 10);
    c.className = 'chip';
    c.style.left = '0'; c.style.top = '-3px';
    arrow.appendChild(c);
    c.animate([{transform:'translateX(0)',opacity:1},{transform:`translateX(${span}px)`,opacity:.25}],
      {duration:700,easing:'ease-in'}).onfinish = ()=>c.remove();
  }
}
setInterval(step, 1400);

function reset(){
  lit = 0;
  [...bin.children].forEach(e=>e.classList.remove('on'));
  [...core.children].forEach(e=>e.classList.remove('lit'));
  fill.style.width='0%'; pct.textContent='0%'; pct.classList.remove('full');
  bcount.textContent = `0/${PARTS.length}`;
  note.textContent = '等待装配 · 点左侧任意零件开始';
}
addEventListener('keydown', e=>{
  if (e.code === 'Space'){ e.preventDefault(); step(); }
  if (e.key === 'r' || e.key === 'R') reset();
});
</script>
</body>
</html>
