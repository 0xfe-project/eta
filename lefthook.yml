# Git hooks, installed by `bun install` (the root `prepare` script).
#
# pre-commit runs in order and stops at the first failure:
# 1. Linters (ESLint and Ruff, in parallel) apply their safe fixes to the staged files and re-stage them.
#    Whatever is left (including problems only an unsafe fix would solve)
#    fails the commit. ESLint fixes are safe by design; its riskier changes
#    are suggestions and never applied. Ruff applies safe fixes only.
# 2. dprint formats the staged files and re-stages them.
# 3. Turbo builds, typechecks, lints, tests and checks the repository for
#    dead code (knip), only for what changed since HEAD (--affected);
#    unchanged tasks come from the cache.
assert_lefthook_installed: true
rc: ./scripts/lefthook-rc.sh

pre-commit:
  piped: true
  jobs:
    - name: fix
      group:
        parallel: true
        jobs:
          - name: eslint
            glob: "*.{js,jsx,ts,tsx,json,jsonc}"
            run: bunx eslint --cache --cache-location node_modules/.cache/eslint/staged --fix --no-warn-ignored {staged_files}
            stage_fixed: true

          - name: ruff
            glob: "*.py"
            run: uv run --project apps/memory ruff check --fix --force-exclude {staged_files}
            stage_fixed: true

    - name: format
      run: bunx dprint fmt --allow-no-files {staged_files}
      stage_fixed: true

    - name: verify
      env:
        TURBO_SCM_BASE: HEAD
      run: bunx turbo run build typecheck lint //#lint:repo test //#knip --affected --output-logs=errors-only
