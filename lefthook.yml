# Git hooks, installed by `bun install` (the root `prepare` script).
#
# pre-commit only formats staged files with dprint and re-stages them.
# All verification checks (build, typecheck, lint, test, knip) run in CI
# and manually via `bun run check` or `bun run check:affected`.
assert_lefthook_installed: true
rc: ./scripts/lefthook-rc.sh

pre-commit:
  jobs:
    - name: format
      run: bunx --bun dprint fmt --allow-no-files {staged_files}
      stage_fixed: true
