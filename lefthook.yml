# Git hooks, installed by `bun install` (the root `prepare` script).
#
# pre-commit runs in order and stops at the first failure:
# 1. Linters apply their safe fixes to the staged files and re-stage them.
#    Whatever is left (including problems only an unsafe fix would solve)
#    fails the commit. ESLint fixes are safe by design; its riskier changes
#    are suggestions and never applied. Ruff applies safe fixes only.
# 2. dprint formats the staged files and re-stages them.
# 3. Turbo builds, typechecks, lints, tests and checks the repository for
#    dead code (knip); unchanged packages come from the cache.
assert_lefthook_installed: true
rc: ./scripts/lefthook-rc.sh

pre-commit:
  piped: true
  jobs:
    - name: eslint
      glob: "*.{js,jsx,ts,tsx,json,jsonc}"
      run: bunx eslint --fix --no-warn-ignored {staged_files}
      stage_fixed: true

    - name: ruff
      glob: "*.py"
      run: uv run --project bundles/memory/service ruff check --fix --force-exclude {staged_files}
      stage_fixed: true

    - name: format
      run: bunx dprint fmt --allow-no-files {staged_files}
      stage_fixed: true

    - name: verify
      run: bunx turbo run build typecheck lint test knip --output-logs=errors-only
